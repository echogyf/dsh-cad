name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Syntax of everything that ships. CAD automation itself cannot run here:
      # it needs AutoCAD, a Windows session, and a COM server.
      - name: Parse the JavaScript
        run: |
          node --check lib/index.js
          node --check lib/paths.mjs
          node --check lib/python.mjs
          node --check lib/runtime.mjs
          node --check lib/plugin.mjs
          node --check bin/dsh-cad.mjs

      - name: Compile the Python
        run: |
          python -m py_compile lib/probe.py
          python -m py_compile patches/apply_patches.py

      - name: Resolve paths without a CAD install
        run: node bin/dsh-cad.mjs where

      - name: Report the pinned upstream
        run: node bin/dsh-cad.mjs version

      - name: Pack
        run: npm pack --dry-run

      # Pure registration/configuration tests use an explicit peer double;
      # the real peer and CAD are checked in the desktop integration test.
      - name: Registration and Python discovery (no skipped peer tests)
        run: npm test

      - name: PowerShell 5.1 discovery and safe target checks
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test/powershell.test.ps1

      - name: Patch safety regression tests
        run: python test/patches.test.py
