# dsh-cad bundle patch.
#
# Inserts one row: this package itself. It is a real cordis plugin (lib/index.js),
# not a wrapper around a binary, so dsh imports it by name from the profile and
# nothing has to be on PATH.
#
# On load the plugin resolves its own paths, makes sure the pinned upstream
# server is installed (installing it once if it is not), and registers one
# @deepseek-ai/dsh-mcp-client row with an absolute path:
#
#   autocad     -> autocad-mcp-pro 1.6.0, DISCOVERY_MODE=search
#
# The version is pinned in lib/upstream.json. If the upstream cannot be installed
# the plugin throws instead of registering a row that would fail silently.

- insert:
    - id: dsh-cad
      name: 'dsh-cad'
